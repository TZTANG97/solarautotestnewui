[ANOTHER]
another = 0

[PATH]
wt_exe = C:/Program Files (x86)/Yokogawa/WTViewerEfree/WTViewerEfree.exe
mppt_exe = D:/software/Chroma/Chroma SAS soft Panel/Chroma Solar Array Simulation Soft Panel.exe
# Use "auto" so ConfigParser never sees bare %VAR% (interpolation crash on older builds).
# Runtime resolves to %LOCALAPPDATA%\SolarAutoTest\wt_save and creates it.
wt_file_save_path = auto
# Optional roots (also config_files/paths.ini). auto = resolve via utils/app_paths.py
# data_root = D:/SolarAutoTest/data
# runtime_root = D:/SolarAutoTest/runtime
recordings = D:/EnergyTest/Recordings/
recordings_wt1800 = D:/EnergyTest/Recordings/WT1800/
recordings_wt1806E = D:/EnergyTest/Recordings/WT1806E/
recordings_wt3000 = D:/EnergyTest/Recordings/WT3000/
recordings_wt5000 = D:/EnergyTest/Recordings/WT5000/

# Auto-update channel (EMKU OSS bucket qgongye, prefix solarautotest/updates):
#   channel = https://qgongye.oss-cn-shanghai.aliyuncs.com/solarautotest/updates
# Publish: packaging\build_release.bat -PublishEmkuOss
#   or:    packaging\Publish-To-EmkuOss.bat  (upload existing dist zip)
# LAN fallback: channel = \\TANG\solarautotestnewui\updates
[update]
enabled = 1
channel = https://qgongye.oss-cn-shanghai.aliyuncs.com/solarautotest/updates
auto_install = 1
